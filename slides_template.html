<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도쿄 4박 숙소 후보</title>
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1d1b18; --muted:#6b665d; --line:#e2ddd2;
  --accent:#c2410c; --p1:#c2410c; --p2:#475569; --ok:#15803d; --warn:#b45309;
  --cover:#1c1917; --cover-ink:#faf7f2; --map:#eef2ee; --grid:#dde4dd; --loop:#2f855a; --hub:#1d4ed8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14110f; --card:#201c19; --ink:#f3eee6; --muted:#a59d90; --line:#37312b; --accent:#fb923c; --p1:#fb923c; --p2:#94a3b8; --ok:#4ade80; --warn:#fbbf24; --cover:#0b0908; --map:#1b2420; --grid:#27332d; --loop:#4ade80; --hub:#7aa2ff; }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0908;overflow:hidden;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:var(--bg);padding:40px 56px;display:none;overflow:hidden}
.slide.active{display:block}
.slide.cover{background:var(--cover);color:var(--cover-ink);padding:0}
h1{font-size:64px;line-height:1.12;letter-spacing:-.02em;font-weight:800}
h2{font-size:30px;line-height:1.25;letter-spacing:-.01em;font-weight:800}
h3{font-size:18px;font-weight:700}
.eyebrow{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);margin-right:6px}
.tag.p1{color:var(--p1);border-color:var(--p1)} .tag.p2{color:var(--p2);border-color:var(--p2)}
.tag.abnb{background:#ff385c;color:#fff;border-color:#ff385c} .tag.agoda{background:#5392f9;color:#fff;border-color:#5392f9}
.tag.low{color:var(--warn);border-color:var(--warn)}
.pg{position:absolute;right:28px;bottom:16px;font-size:13px;color:var(--muted)}
.cover .pg{color:#8a8178}
.cover-in{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 88px;position:relative}
.cover-in:before{content:"";position:absolute;right:-120px;top:-120px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,#c2410c 0%,rgba(194,65,12,0) 68%);opacity:.55}
.cover .meta{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
.cover .chip{border:1px solid #57514a;border-radius:12px;padding:12px 18px;font-size:18px}
.cover .chip b{display:block;font-size:13px;color:#a59d90;letter-spacing:.08em;margin-bottom:2px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px}
.card h3{margin-bottom:8px}
.card p,.card li{font-size:15.5px;line-height:1.55}
.card ul{padding-left:18px}
.head{margin-bottom:18px}
.head h2{margin-top:6px}
.pick{display:flex;flex-direction:column;gap:4px;padding:12px 16px}
.pick .lab{font-size:12.5px;font-weight:800;color:var(--accent);letter-spacing:.06em}
.pick .nm{font-size:16px;font-weight:800;line-height:1.3;height:42px;overflow:hidden}
.pick .pr{font-size:22px;font-weight:800}
.pick .ph{height:92px;border-radius:10px;background:#d9d3c7 center/cover no-repeat}
.pick .note{font-size:12.5px;line-height:1.4;color:var(--muted);height:52px;overflow:hidden}
.rank-wrap{display:grid;grid-template-columns:260px 1fr;gap:20px;height:584px}
.sliders{display:flex;flex-direction:column;gap:11px}
.sl label{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:3px}
.sl input{width:100%;accent-color:var(--accent)}
.sliders .hint{font-size:13px;color:var(--muted);line-height:1.5}
.rtable{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rtable table{width:100%;border-collapse:collapse;font-size:12.5px}
.rtable th{position:sticky;top:0;background:var(--card);text-align:left;padding:7px 7px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.rtable td{padding:0 7px;border-bottom:1px solid var(--line);height:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.rtable td.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;margin-right:6px}
.rtable .scroll{height:100%;overflow:auto}
.detail .top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.detail h2{font-size:25px;max-width:930px}
.score{flex:none;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.score b{display:block;font-size:28px;line-height:1.1;color:var(--accent)}
.score span{font-size:11px;color:var(--muted)}
.detail .body{display:grid;grid-template-columns:372px 420px 330px;gap:22px;margin-top:14px}
.price{font-size:36px;font-weight:800;letter-spacing:-.02em}
.price small{font-size:14px;font-weight:600;color:var(--muted);margin-left:6px;letter-spacing:0}
.basis{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.facts{width:100%;border-collapse:collapse;font-size:14px}
.facts td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
.facts td:first-child{width:66px;color:var(--muted);font-size:13px}
.facts .em b{font-size:16px;color:var(--accent)}
.facts .sub{display:block;font-size:12px;color:var(--muted)}
.chips span{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;margin:0 4px 4px 0;border:1px solid var(--line)}
.chips .y{background:rgba(21,128,61,.12);color:var(--ok);border-color:transparent}
.chips .n{color:var(--muted);text-decoration:line-through}
.chips .u{color:var(--warn);border-color:var(--warn)}
/* 사진 캐러셀 */
.car{width:420px}
.cmain{position:relative;height:306px;border-radius:12px;overflow:hidden;background:#d9d3c7;cursor:zoom-in}
.cmain img{width:100%;height:100%;object-fit:cover;display:block}
.cbtn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(20,17,15,.55);color:#fff;font-size:22px;line-height:36px;cursor:pointer}
.cbtn:hover{background:rgba(20,17,15,.8)}
.cprev{left:8px} .cnext{right:8px}
.ccount{position:absolute;right:10px;bottom:8px;background:rgba(20,17,15,.65);color:#fff;font-size:12px;padding:2px 9px;border-radius:999px}
.cthumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
.cthumbs img{width:100%;height:48px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.6;border:2px solid transparent;display:block}
.cthumbs img.on{opacity:1;border-color:var(--accent)}
.chint{font-size:11.5px;color:var(--muted);margin-top:5px}
.nophoto{height:306px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;text-align:center;padding:16px}
.mapbox{background:var(--map);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapbox svg{display:block}
.dchips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dchips span{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.dchips span i{font-style:normal;color:var(--accent)}
.hl{font-size:13.5px;line-height:1.45;margin-top:8px;padding:8px 11px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.links{margin-top:9px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-block;padding:8px 14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:13.5px;text-decoration:none}
.btn.off{background:var(--line);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.section{display:flex;flex-direction:column;justify-content:center;height:100%}
.section h1{font-size:52px}
.ovw{display:grid;grid-template-columns:740px 1fr;gap:20px}
.ovlist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;height:560px;overflow:auto;font-size:12px;line-height:1.5}
.ovlist div{display:flex;gap:6px;white-space:nowrap}
.ovlist b{display:inline-block;width:22px;text-align:right;color:var(--accent)}
.ovlist span.n{overflow:hidden;text-overflow:ellipsis;flex:1}
.app table{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.app th{background:var(--card);text-align:left;padding:6px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.app td{padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}
.app td:nth-child(1){max-width:200px}
.app td:nth-child(4){white-space:normal;line-height:1.25;font-size:11.5px}
.app td.num{text-align:right;font-variant-numeric:tabular-nums}
#nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;z-index:5;opacity:0;transition:opacity .2s}
body:hover #nav{opacity:.9}
#nav button{border:0;background:#2c2723;color:#f3eee6;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
#lb{position:fixed;inset:0;background:rgba(10,8,7,.94);z-index:20;display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:88vh;object-fit:contain}
#lb .lbc{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#ddd;font-size:14px}
#lb button{position:absolute;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:30px;width:52px;height:52px;border-radius:50%;cursor:pointer}
#lb .lbp{left:18px;top:50%;transform:translateY(-50%)} #lb .lbn{right:18px;top:50%;transform:translateY(-50%)} #lb .lbx{right:18px;top:14px;font-size:24px}
svg text{font-family:inherit}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  #viewport{position:static;display:block}
  #stage{transform:none!important;width:auto;height:auto}
  .slide{display:block!important;position:relative;width:1280px;height:720px;page-break-after:always}
  #nav,#lb{display:none}
}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="nav"><button id="prev">← 이전</button><button id="next">다음 →</button></div>
<div id="lb"><span class="lbc"></span><button class="lbp">‹</button><img alt=""><button class="lbn">›</button><button class="lbx">×</button></div>
<script>
const DATA = /*DATA*/null;
const ALL = DATA.listings;
const BUDGET = DATA.meta.budget_krw;
const AREA_MIN = DATA.meta.area_min_m2;
const L = ALL.filter(x => !x.exclude_reason);     // 본문 대상
const OUT = ALL.filter(x => x.exclude_reason);    // 참고(예산 초과 / 면적 미달 / 번화가에서 멂)
const won = n => n==null ? '미확인' : '₩' + Math.round(n).toLocaleString('ko-KR');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const HUBS = {shinjuku:['신주쿠',35.6896,139.7006], shibuya:['시부야',35.6580,139.7016], ikebukuro:['이케부쿠로',35.7295,139.7109]};
const LOOP = [[35.6812,139.7671],[35.6666,139.7583],[35.6553,139.7571],[35.6456,139.7476],[35.6285,139.7387],[35.6197,139.7286],[35.6262,139.7235],[35.6339,139.7158],[35.6467,139.7101],[35.6580,139.7016],[35.6702,139.7027],[35.6831,139.7020],[35.6896,139.7006],[35.7012,139.7001],[35.7126,139.7038],[35.7213,139.7066],[35.7295,139.7109],[35.7316,139.7285],[35.7336,139.7395],[35.7364,139.7469],[35.7381,139.7609],[35.7278,139.7708],[35.7206,139.7781],[35.7141,139.7774],[35.7076,139.7747],[35.6984,139.7731],[35.6918,139.7709],[35.6812,139.7671]];

/* ---------- 참고 점수 ---------- */
const DEFAULT_W = {price:30, rating:20, walk:15, area:10, space:15, cancel:10};
const W_LABEL = {price:'가격(낮을수록)', rating:'평점(후기 수 보정)', walk:'역까지 도보', area:'번화가 근접도', space:'4인 공간(침실·침대·면적)', cancel:'무료 취소'};
function subScores(l, pmin, pmax){
  const n = l.reviews || 0;
  const base = l.rating10==null ? 8.0 : (l.rating10*n + 8.5*10)/(n+10);
  const br = l.bedrooms==null ? null : Math.max(l.bedrooms,1);
  const a = br==null ? .5 : Math.min(br,3)/3;
  const b = l.beds==null ? .5 : Math.min(l.beds,4)/4;
  const c = l.area_m2==null ? .5 : clamp(l.area_m2/60);
  const dmin = Math.min(l.dist_shinjuku_km, l.dist_shibuya_km);
  return {
    price: pmax===pmin ? 1 : (pmax-l.total_krw)/(pmax-pmin),
    rating: clamp((base-7.5)/2.5),
    walk: l.walk_min==null ? .5 : clamp((15-l.walk_min)/15),
    area: clamp(1 - (dmin-1)/5),
    space: .4*a + .3*b + .3*c,
    cancel: l.free_cancel==null ? .3 : l.free_cancel
  };
}
function scoreAll(W){
  const ps = L.map(x=>x.total_krw), pmin=Math.min(...ps), pmax=Math.max(...ps);
  const sw = Object.values(W).reduce((a,b)=>a+b,0) || 1;
  return L.map(l=>{ const s = subScores(l,pmin,pmax); let t=0; for (const k in W) t += W[k]*s[k]; return {l, score:t/sw*100}; });
}
const base = scoreAll(DEFAULT_W);
const scoreOf = {}; base.forEach(o=>scoreOf[o.l.id]=o.score);
const rankOrder = [...base].sort((a,b)=>b.score-a.score).map(o=>o.l.id);
const rankNo = {}; rankOrder.forEach((id,i)=>rankNo[id]=i+1);

/* ---------- 표시 헬퍼 ---------- */
const perPP = l => l.total_krw/4/4;
const cancelTxt = l => l.free_cancel===1 ? ('✔ ' + (l.cancel_note||'무료 취소')) : (l.free_cancel===0 ? '✘ ' + (l.cancel_note||'무료 취소 없음') : '? ' + (l.cancel_note||'미확인'));
const amen = (label, v) => `<span class="${v===1?'y':(v===0?'n':'u')}">${label}${v==null?' ?':''}</span>`;
const tagT = l => `<span class="tag ${l.tier===1?'p1':'p2'}">${l.tier===1?'번화가권 (시부야·신주쿠 3km 내)':'이케부쿠로권'}</span>`;
const tagPl = l => `<span class="tag ${l.platform==='Airbnb'?'abnb':'agoda'}">${l.platform}</span>`;
const isLow = l => /^낮음/.test(l.conf||'');
const bedroomTxt = l => l.bedrooms==null ? '<span class="muted">미공개</span>' : (l.bedrooms===0 ? '<b>스튜디오</b>' : `<b>${l.bedrooms}개</b>`);
const bedroomShort = l => l.bedrooms==null ? '-' : (l.bedrooms===0 ? '스튜디오' : l.bedrooms);
function spec(l){
  const bits=[];
  if (l.beds!=null) bits.push(`침대 ${l.beds}`);
  if (l.baths!=null) bits.push(`욕실 ${l.baths}`);
  if (l.capacity!=null) bits.push(`최대 ${l.capacity}인`);
  return bits.length ? bits.join(' · ') : '미공개';
}
const areaTxt = l => l.area_m2!=null ? `<b>${l.area_m2}㎡</b>` : `<span class="muted">${l.platform==='Airbnb'?'호스트 미기재':'미확인'}</span>`;
function carouselHTML(l){
  const ph = l.photos_local||[];
  if (!ph.length) return `<div class="nophoto">사진을 저장하지 못했습니다<br>예약 링크에서 확인하세요</div>`;
  const thumbs = ph.map((u,i)=>`<img src="${esc(u)}" data-i="${i}" loading="lazy" alt="" class="${i===0?'on':''}">`).join('');
  return `<div class="car" data-ph="${esc(JSON.stringify(ph))}" data-i="0">
    <div class="cmain"><img class="cimg" src="${esc(ph[0])}" alt="">${ph.length>1?'<button class="cbtn cprev" aria-label="이전 사진">‹</button><button class="cbtn cnext" aria-label="다음 사진">›</button>':''}<span class="ccount">1 / ${ph.length}</span></div>
    ${ph.length>1?`<div class="cthumbs">${thumbs}</div>`:''}
    <div class="chint">사진 ${ph.length}장 · 클릭하면 크게 · ↑↓ 키로 넘기기</div></div>`;
}

/* ---------- 지도 (외부 타일 없이 SVG) ---------- */
function project(lat,lng,lat0,lng0){ return [ (lng-lng0)*Math.cos(lat0*Math.PI/180)*111.32, -(lat-lat0)*110.57 ]; }
function makeMap(points, W, H, opts={}){
  const lat0 = points.reduce((a,p)=>a+p.lat,0)/points.length, lng0 = points.reduce((a,p)=>a+p.lng,0)/points.length;
  const P = points.map(p=>({...p, xy:project(p.lat,p.lng,lat0,lng0)}));
  let minx=Math.min(...P.map(p=>p.xy[0])), maxx=Math.max(...P.map(p=>p.xy[0])), miny=Math.min(...P.map(p=>p.xy[1])), maxy=Math.max(...P.map(p=>p.xy[1]));
  const pad = opts.pad ?? 0.9;
  minx-=pad; maxx+=pad; miny-=pad; maxy+=pad;
  const asp = W/H; let w=maxx-minx, h=maxy-miny;
  if (w/h < asp){ const nw=h*asp; const c=(minx+maxx)/2; minx=c-nw/2; maxx=c+nw/2; w=nw; } else { const nh=w/asp; const c=(miny+maxy)/2; miny=c-nh/2; maxy=c+nh/2; h=nh; }
  const s = W/w;
  const X = x => (x-minx)*s, Y = y => (y-miny)*s;
  let g = '';
  for (let gx=Math.ceil(minx); gx<=maxx; gx++) g += `<line x1="${X(gx)}" y1="0" x2="${X(gx)}" y2="${H}" stroke="var(--grid)" stroke-width="1"/>`;
  for (let gy=Math.ceil(miny); gy<=maxy; gy++) g += `<line x1="0" y1="${Y(gy)}" x2="${W}" y2="${Y(gy)}" stroke="var(--grid)" stroke-width="1"/>`;
  const loop = LOOP.map(([la,ln])=>{ const [x,y]=project(la,ln,lat0,lng0); return `${X(x).toFixed(1)},${Y(y).toFixed(1)}`; }).join(' ');
  g += `<polyline points="${loop}" fill="none" stroke="var(--loop)" stroke-width="3" stroke-dasharray="7 4" opacity=".75"/>`;
  const me = P.find(p=>p.kind==='me');
  let pills = '';
  if (me && opts.lines!==false){
    P.filter(p=>p.kind==='hub').forEach(h=>{
      const x1=X(me.xy[0]), y1=Y(me.xy[1]), x2=X(h.xy[0]), y2=Y(h.xy[1]);
      const km = Math.hypot(h.xy[0]-me.xy[0], h.xy[1]-me.xy[1]);
      g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4" opacity=".85"/>`;
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      pills += `<rect x="${mx-21}" y="${my-10}" width="42" height="18" rx="9" fill="var(--card)" stroke="var(--accent)"/><text x="${mx}" y="${my+3.5}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent)">${km.toFixed(1)}km</text>`;
    });
  }
  P.filter(p=>p.kind==='hub').forEach(h=>{
    const x=X(h.xy[0]), y=Y(h.xy[1]);
    const left = me ? (h.xy[0] < me.xy[0]) : false;
    const tx = left ? Math.max(40,x-10) : Math.min(W-40,x+10);
    g += `<circle cx="${x}" cy="${y}" r="7" fill="var(--hub)" stroke="#fff" stroke-width="2"/><text x="${tx}" y="${y-9}" text-anchor="${left?'end':'start'}" font-size="13" font-weight="800" fill="var(--hub)" stroke="var(--map)" stroke-width="3" paint-order="stroke">${esc(h.label)}</text>`;
  });
  g += pills;
  P.filter(p=>p.kind==='dot').forEach(p=>{

  });

    g += `<circle cx="${x}" cy="${y}" r="15" fill="var(--accent)" opacity=".22"/><path d="M${x} ${y+2} C ${x-13} ${y-16}, ${x-9} ${y-30}, ${x} ${y-30} C ${x+9} ${y-30}, ${x+13} ${y-16}, ${x} ${y+2} Z" fill="var(--accent)" stroke="#fff" stroke-width="2"/><circle cx="${x}" cy="${y-19}" r="4.5" fill="#fff"/>`;

  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}
function mapFor(l){

const lb = document.getElementById('lb'), lbImg = lb.querySelector('img'), lbCnt = lb.querySelector('.lbc');

function carGo(car, i){
  const ph = JSON.parse(car.dataset.ph); const n = ph.length;
  const k = ((i % n) + n) % n; car.dataset.i = k;
  car.querySelector('.cimg').src = ph[k];
  car.querySelector('.ccount').textContent = `${k+1} / ${n}`;
  car.querySelectorAll('.cthumbs img').forEach((t,j)=>t.classList.toggle('on', j===k));

}
const carStep = (car, d) => carGo(car, (+car.dataset.i) + d);

lb.querySelector('.lbn').onclick = e=>{ e.stopPropagation(); carStep(lbCar,1); };
lb.querySelector('.lbx').onclick = lbClose;
lb.addEventListener('click', e=>{ if (e.target===lb) lbClose(); });

addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT') return;
  if (lb.classList.contains('on')){
    if (e.key==='Escape') lbClose();
    if (e.key==='ArrowRight'||e.key==='ArrowDown') carStep(lbCar,1);
    if (e.key==='ArrowLeft'||e.key==='ArrowUp') carStep(lbCar,-1);
    e.preventDefault(); return;
  }
  const car = els[cur].querySelector('.car');
  if (car && e.key==='ArrowDown'){ e.preventDefault(); return carStep(car,1); }
  if (car && e.key==='ArrowUp'){ e.preventDefault(); return carStep(car,-1); }
  if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); show(cur+1); }
  if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); show(cur-1); }
  if (e.key==='Home') show(0);
  if (e.key==='End') show(els.length-1);
});
document.getElementById('prev').onclick = ()=>show(cur-1);
document.getElementById('next').onclick = ()=>show(cur+1);
show((parseInt(location.hash.slice(1))||1)-1);

/* 순위 슬라이드 */
const W = {...DEFAULT_W};
const sliders = document.getElementById('sliders');
Object.keys(W).forEach(k=>{
  const d = document.createElement('div'); d.className='sl';
  d.innerHTML = `<label><span>${W_LABEL[k]}</span><span id="v_${k}">${W[k]}</span></label><input type="range" min="0" max="50" value="${W[k]}" data-k="${k}">`;
  sliders.appendChild(d);
});
const hint = document.createElement('div'); hint.className='hint';
hint.innerHTML = '각 항목을 0~100으로 환산해 가중 평균합니다. 합이 100이 아니어도 자동 정규화됩니다.<br>번화가 근접도 = 시부야·신주쿠역까지 직선거리(1km 이내 만점, 6km 이상 0점).<br><button id="reset" style="margin-top:8px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer">기본값으로</button>';
sliders.appendChild(hint);
function renderRank(){
  const rows = scoreAll(W).sort((a,b)=>b.score-a.score);
  document.getElementById('rbody').innerHTML = rows.map((o,i)=>{
    const l=o.l, dm=Math.min(l.dist_shinjuku_km,l.dist_shibuya_km);
    return `<tr><td class="num">${i+1}</td><td title="${esc(l.name)}">${l.tier===1?'● ':'○ '}${esc(l.name)}</td><td>${l.platform==='Airbnb'?'Ab':'Ag'}</td><td class="num">${won(l.total_krw)}</td><td class="num">${l.rating10!=null?l.rating10.toFixed(1):'-'}</td><td class="num">${bedroomShort(l)}</td><td class="num">${l.area_m2!=null?l.area_m2+'㎡':'-'}</td><td class="num">${dm.toFixed(1)}km</td><td><span class="bar" style="width:${Math.round(o.score*0.5)}px"></span>${o.score.toFixed(0)}</td></tr>`;
  }).join('');
}
sliders.addEventListener('input', e=>{ const k=e.target.dataset.k; if(!k) return; W[k]=+e.target.value; document.getElementById('v_'+k).textContent=W[k]; renderRank(); });
document.getElementById('reset').onclick = ()=>{
  Object.assign(W, DEFAULT_W);
  sliders.querySelectorAll('input').forEach(i=>{ i.value=W[i.dataset.k]; document.getElementById('v_'+i.dataset.k).textContent=W[i.dataset.k]; });
  renderRank();
};
renderRank();
</script>
