<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도쿄 4박 숙소 후보</title>
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1d1b18; --muted:#6b665d; --line:#e2ddd2;
  --accent:#c2410c; --p1:#c2410c; --p2:#475569; --ok:#15803d; --warn:#b45309;
  --cover:#1c1917; --cover-ink:#faf7f2; --map:#eef2ee; --grid:#dde4dd; --loop:#2f855a; --hub:#1d4ed8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14110f; --card:#201c19; --ink:#f3eee6; --muted:#a59d90; --line:#37312b; --accent:#fb923c; --p1:#fb923c; --p2:#94a3b8; --ok:#4ade80; --warn:#fbbf24; --cover:#0b0908; --map:#1b2420; --grid:#27332d; --loop:#4ade80; --hub:#7aa2ff; }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0908;overflow:hidden;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:var(--bg);padding:40px 56px;display:none;overflow:hidden}
.slide.active{display:block}
.slide.cover{background:var(--cover);color:var(--cover-ink);padding:0}
h1{font-size:64px;line-height:1.12;letter-spacing:-.02em;font-weight:800}
h2{font-size:30px;line-height:1.25;letter-spacing:-.01em;font-weight:800}
h3{font-size:18px;font-weight:700}
.eyebrow{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);margin-right:6px}
.tag.p1{color:var(--p1);border-color:var(--p1)} .tag.p2{color:var(--p2);border-color:var(--p2)}
.tag.abnb{background:#ff385c;color:#fff;border-color:#ff385c} .tag.agoda{background:#5392f9;color:#fff;border-color:#5392f9}
.tag.low{color:var(--warn);border-color:var(--warn)}
.pg{position:absolute;right:28px;bottom:16px;font-size:13px;color:var(--muted)}
.cover .pg{color:#8a8178}
.cover-in{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 88px;position:relative}
.cover-in:before{content:"";position:absolute;right:-120px;top:-120px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,#c2410c 0%,rgba(194,65,12,0) 68%);opacity:.55}
.cover .meta{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
.cover .chip{border:1px solid #57514a;border-radius:12px;padding:12px 18px;font-size:18px}
.cover .chip b{display:block;font-size:13px;color:#a59d90;letter-spacing:.08em;margin-bottom:2px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px}
.card h3{margin-bottom:8px}
.card p,.card li{font-size:15.5px;line-height:1.55}
.card ul{padding-left:18px}
.head{margin-bottom:18px}
.head h2{margin-top:6px}
.pick{display:flex;flex-direction:column;gap:4px;padding:12px 16px}
.pick .lab{font-size:12.5px;font-weight:800;color:var(--accent);letter-spacing:.06em}
.pick .nm{font-size:16px;font-weight:800;line-height:1.3;height:42px;overflow:hidden}
.pick .pr{font-size:22px;font-weight:800}
.pick .ph{height:92px;border-radius:10px;background:#d9d3c7 center/cover no-repeat}
.pick .note{font-size:12.5px;line-height:1.4;color:var(--muted);height:52px;overflow:hidden}
.rank-wrap{display:grid;grid-template-columns:270px 1fr;gap:20px;height:580px}
.sliders{display:flex;flex-direction:column;gap:11px}
.sl label{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:3px}
.sl input{width:100%;accent-color:var(--accent)}
.sliders .hint{font-size:13px;color:var(--muted);line-height:1.5}
.rtable{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rtable table{width:100%;border-collapse:collapse;font-size:13px}
.rtable th{position:sticky;top:0;background:var(--card);text-align:left;padding:7px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.rtable td{padding:0 8px;border-bottom:1px solid var(--line);height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.rtable td.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;margin-right:6px}
.rtable .scroll{height:100%;overflow:auto}
.detail .top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.detail h2{font-size:25px;max-width:930px}
.score{flex:none;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.score b{display:block;font-size:28px;line-height:1.1;color:var(--accent)}
.score span{font-size:11px;color:var(--muted)}
.detail .body{display:grid;grid-template-columns:400px 360px 1fr;gap:22px;margin-top:14px}
.price{font-size:38px;font-weight:800;letter-spacing:-.02em}
.price small{font-size:14px;font-weight:600;color:var(--muted);margin-left:6px;letter-spacing:0}
.basis{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.facts{width:100%;border-collapse:collapse;font-size:14.5px}
.facts td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.facts td:first-child{width:74px;color:var(--muted);font-size:13px}
.facts .area b{font-size:16px;color:var(--accent)}
.chips span{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;margin:0 4px 4px 0;border:1px solid var(--line)}
.chips .y{background:rgba(21,128,61,.12);color:var(--ok);border-color:transparent}
.chips .n{color:var(--muted);text-decoration:line-through}
.chips .u{color:var(--warn);border-color:var(--warn)}
.collage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:290px 140px;gap:6px;height:436px}
.collage .p{background:#d9d3c7 center/cover no-repeat;border-radius:10px}
.collage .p:first-child{grid-column:1 / span 2}
.collage.c1 .p:first-child{grid-row:1 / span 2}
.collage.c2{grid-template-rows:290px 140px}
.nophoto{height:436px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;text-align:center;padding:16px}
.mapbox{background:var(--map);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapbox svg{display:block}
.dchips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dchips span{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.dchips span i{font-style:normal;color:var(--accent)}
.hl{font-size:14px;line-height:1.5;margin-top:9px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.links{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-block;padding:8px 14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:13.5px;text-decoration:none}
.btn.off{background:var(--line);color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
.section{display:flex;flex-direction:column;justify-content:center;height:100%}
.section h1{font-size:52px}
.ovw{display:grid;grid-template-columns:740px 1fr;gap:20px}
.ovlist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;height:560px;overflow:auto;font-size:12.5px;line-height:1.5}
.ovlist div{display:flex;gap:6px;white-space:nowrap}
.ovlist b{display:inline-block;width:22px;text-align:right;color:var(--accent)}
.ovlist span.n{overflow:hidden;text-overflow:ellipsis;flex:1}
.app table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.app th{background:var(--card);text-align:left;padding:6px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.app td{padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}
.app td:nth-child(1){max-width:215px}
.app td:nth-child(4){white-space:normal;line-height:1.25;font-size:11.5px}
.app td.num{text-align:right;font-variant-numeric:tabular-nums}
#nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;z-index:5;opacity:0;transition:opacity .2s}
body:hover #nav{opacity:.9}
#nav button{border:0;background:#2c2723;color:#f3eee6;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
svg text{font-family:inherit}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  #viewport{position:static;display:block}
  #stage{transform:none!important;width:auto;height:auto}
  .slide{display:block!important;position:relative;width:1280px;height:720px;page-break-after:always}
  #nav{display:none}
}
</style>
</head>

  P.filter(p=>p.kind==='dot').forEach(p=>{
    const x=X(p.xy[0]), y=Y(p.xy[1]);
    g += `<circle cx="${x}" cy="${y}" r="10" fill="${p.color}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${esc(p.label)}</text>`;
  });
  if (me){
    const x=X(me.xy[0]), y=Y(me.xy[1]);
    g += `<circle cx="${x}" cy="${y}" r="15" fill="var(--accent)" opacity=".22"/><path d="M${x} ${y+2} C ${x-13} ${y-16}, ${x-9} ${y-30}, ${x} ${y-30} C ${x+9} ${y-30}, ${x+13} ${y-16}, ${x} ${y+2} Z" fill="var(--accent)" stroke="#fff" stroke-width="2"/><circle cx="${x}" cy="${y-19}" r="4.5" fill="#fff"/>`;
  }
  // 축척 1km
  g += `<g transform="translate(12,${H-16})"><line x1="0" y1="0" x2="${s}" y2="0" stroke="var(--ink)" stroke-width="3"/><text x="${s+6}" y="4" font-size="11" fill="var(--ink)">1 km</text></g>`;

  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}
function mapFor(l){

  document.getElementById('rbody').innerHTML = rows.map((o,i)=>{
    const l=o.l, dm=Math.min(l.dist_shinjuku_km,l.dist_shibuya_km);
    return `<tr><td class="num">${i+1}</td><td title="${esc(l.name)}">${l.tier===1?'● ':'○ '}${esc(l.name)}</td><td>${l.platform==='Airbnb'?'Ab':'Ag'}</td><td class="num">${won(l.total_krw)}</td><td class="num">${l.rating10!=null?l.rating10.toFixed(1):'-'}</td><td class="num">${l.area_m2!=null?l.area_m2+'㎡':'-'}</td><td class="num">${dm.toFixed(1)}km</td><td><span class="bar" style="width:${Math.round(o.score*0.6)}px"></span>${o.score.toFixed(0)}</td></tr>`;
  }).join('');
}
sliders.addEventListener('input', e=>{ const k=e.target.dataset.k; if(!k) return; W[k]=+e.target.value; document.getElementById('v_'+k).textContent=W[k]; renderRank(); });
document.getElementById('reset').onclick = ()=>{
  Object.assign(W, DEFAULT_W);
  sliders.querySelectorAll('input').forEach(i=>{ i.value=W[i.dataset.k]; document.getElementById('v_'+i.dataset.k).textContent=W[i.dataset.k]; });
  renderRank();
};
renderRank();
</script>
</body>
</html>
